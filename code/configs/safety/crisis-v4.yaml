# Fixed crisis resources, crisis-v4 (B7 frozen fix, 2026-11-09). crisis-v1, v2 and v3 yaml stay unchanged.
# v4 = crisis-v3 signals and clusters verbatim, plus additions for indirect danger, self-harm and coercion wording
# (written from the dev probes-v2 set and general crisis language). The template is byte-identical to v3; the
# harness adds it before the reply and the model never writes it. Pipeline selects v4 on the full-v0 path only,
# where the context note is checked too; config.CRISIS_YAML (the default) stays crisis-v3.
# Any edit changes the sha256; update configs/safety/crisis-v4.sha256 on purpose. On a mismatch or load error the
# harness uses the built-in v4 copy in harness/crisis.py, which must match this file exactly (tests check it).
version: crisis-v4
checked: "2026-10-27 by the Operator: 911 = US emergency number; 988 = Suicide & Crisis Lifeline (US), call or text. Same text as crisis-v1."
template: >-
  If you're in immediate danger, call 911 (US). For crisis support, call or text 988
  (Suicide & Crisis Lifeline, US). Outside the US, call your local emergency number.
# Signals 1-14: crisis-v3 verbatim. Signals 15+: B7 frozen-fix additions.
signals:
  - '\b(i|i''m|im|i am)\b[^.?!]{0,12}\b(not|don''t|dont|do not|no longer)\s+(feel\s+)?safe\b'
  - '\b(i''m|im|i am|we''re|we are|someone is|he is|she is|they are)\s+in\s+(immediate\s+)?danger\b'
  - '\b(kill|hurt|harm|cut)(ing)?\s+(myself|herself|himself|themselves|themself)\b'
  - '\bsuicid(e|al)\b'
  - '\bself[- ]?harm'
  - '\b(end\s+my\s+life|end\s+it\s+all|take\s+my\s+(own\s+)?life)\b'
  - '\b(i\s+)?want\s+to\s+die\b'
  - '\bno\s+reason\s+to\s+(live|go\s+on)\b'
  - '\boverdos(e|ed|ing)\b'
  - '\b(he|she|they|someone)(''s|\s+is|\s+are|''re)?\s+(going\s+to|threatening\s+to|trying\s+to)\s+(hurt|kill)\s+(me|us)\b'
  - '\b(can''t|cant|cannot|can\s+not)\s+go\s+on\b(?!\s+(the\s+|a\s+|that\s+|this\s+|my\s+)?(record|stage|air|tv|camera|leave|vacation|holiday|tour|trip|date|call|stream|line|ride|website|site|internet)\b)'
  - '\b(nobody|no\s+one|no-one)\s+(would|will|''d|is\s+going\s+to)\s+(even\s+)?(miss|notice)\s+(me|if\s+i)\b'
  - '\b(he|she|they|someone|somebody|my\s+(husband|wife|partner|boyfriend|girlfriend|dad|father|mom|mother|parent|stepdad|stepmom|stepfather|stepmother|ex|uncle|brother|sister|teacher|coach))\s+(hits|hit|beats|beat|hurts|hurt|abuses|abused|kicks|kicked|chokes|choked|is\s+(hitting|abusing|hurting|beating)|has\s+been\s+(hitting|abusing|hurting|beating)|used\s+to\s+(hit|beat|abuse|hurt))\s+me\b(?!\s+up\b)'
  - '\bi\s+(was|am|''m|have\s+been|got|was\s+being|am\s+being)\s+(being\s+)?(abused|assaulted|raped|molested|beaten)\b'
  - '\b(don''t|dont|do not|no longer)\s+want\s+to\s+(be\s+alive|live|exist|wake\s+up)\b'
  - '\b(better\s+off\s+without\s+me|better\s+off\s+if\s+i\s+(was|were)\s+(gone|dead|not\s+here))\b'
  - '\b(go|going|gone)\s+(quiet|away|dark)\s+for\s+good\b'
  - '\b(trying\s+to\s+break|breaking|broke|broken)\s+in(to)?\s+(my|our|the)\s+(home|house|apartment|flat|room|car|place)\b'
  - '\b(he|she|they|my\s+\w+|the\s+baby|someone)\s+(isn''t|isnt|is\s+not|stopped|can''t|cant|cannot)\s+breathing\b'
  - '\bthreaten(ed|s|ing)?\s+to\s+(hurt|kill|harm|beat|attack|stab|shoot)\s+(me|us|them|him|her|my\s+(kids|children|family|baby))\b'
# Clusters: crisis-v3 verbatim (goodbye-planning, physical-shelter), then B7 additions. Each fires only when at
# least `min` distinct groups match in the same message.
clusters:
  - name: goodbye-planning
    min: 2
    groups:
      - '\b(giv(e|ing)|gave)\s+(away\s+)?(my|all\s+my|most\s+of\s+my)\s+(stuff|things|belongings|possessions|clothes|books|records)(\s+away)?\b'
      - '\b(wrote|writing|written|write)\s+(goodbye\s+)?letters?\s+(to|for)\b|\bgoodbye\s+letters?\b'
      - '\b(weirdly|strangely|oddly|suddenly|weird(ly)?|strange(ly)?)\s+calm\b|\bat\s+peace\s+now\b'
      - '\b(settl(e|ed|ing)|put(ting)?\s+in\s+order)\s+(my\s+)?(affairs|accounts)\b|\b(made|updated|wrote)\s+(out\s+)?my\s+will\b'
  - name: physical-shelter
    min: 2
    groups:
      - '\b(locked|hiding|hid|barricaded)\s+(myself\s+)?(in|inside)\s+(the\s+|my\s+|a\s+)?(bathroom|bedroom|room|closet|car)\b|\b(in|inside)\s+the\s+(bathroom|bedroom|room|closet)\s+with\s+the\s+door\s+locked\b'
      - '\b(threw|throwing|thrown|smashed|smashing|punched|punching)\s+(a|the|my)?\s*(glass|plate|bottle|chair|things|stuff|something|phone|wall|door)\b|\b(i''ll|i\s+will|you''ll|you\s+will)\s+regret\s+(it|this)\b|\b(screaming|yelling|shouting)\s+(at\s+me|that\s+i)\b|\b(has|with|grabbed)\s+a\s+(knife|gun|weapon|bat)\b|\btrying\s+to\s+(break|get)\s+(in|the\s+door)\b'
  - name: trapped-hazard
    min: 2
    groups:
      - '\b(car|truck|vehicle|we|i)\s+(slid|skidded|crashed|flipped|rolled|went)\s+(off|into|over)\b|\boff\s+the\s+road\b|\binto\s+(a|the)\s+(ditch|river|lake|canal)\b|\b(house|building|car|kitchen|room)\s+is\s+on\s+fire\b'
      - '\b(water|smoke|fire|flames)\s+(is|are)\s+(coming|pouring|getting|rising|spreading)\b|\b(seat\s*belt|door|window)s?\s+(is\s+|are\s+)?(jammed|stuck)\b|\b(i''m|im|i\s+am|we''re|we\s+are)\s+trapped\b'
  - name: coercive-control
    min: 2
    groups:
      - '\b(decides|controls|chooses|dictates)\s+(what|who|where|when|how)\s+i\b|\b(won''t|wont|doesn''t|does\s+not|will\s+not)\s+let\s+me\s+(see|talk\s+to|call|text|leave|go\s+out|have\s+money|work)\b|\b(i''m|im|i\s+am)\s+not\s+allowed\s+to\s+(leave|go|see|talk|call|text|work)\b|\b(asking|ask|need)\s+(for\s+)?permission\s+(before|to)\s+(i\s+)?(call|see|leave|go\s+out|talk|text|eat|spend)\b|\bcontrols?\s+(all\s+)?(my|our|their|his|her)\s+(money|phone|finances|bank\s+account|cards?)\b'
      - '\b(take|taking)\s+(away\s+)?(the|my|our)\s+(kids|children|baby)\b|\b(tell|telling)\s+everyone\s+(i''m|im|i\s+am)\b|\breads\s+(everything|all\s+my\s+(messages|texts|emails))\b|\b(checks|goes\s+through|tracks|monitors)\s+(my\s+)?(phone|messages|texts|location|emails)\b|\bcareful\s+what\s+i\s+(type|say|write|text)\b|\bisolat(es|ed|ing)\s+(me|them|him|her)\b|\b(shouts|yells|screams)\s+at\s+(me|them|him|her)\s+until\b'
